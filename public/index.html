<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="把自然语言描述转成绘制计划，再由笔触渲染成 SVG 油画。支持参考图重绘、经典笔触与色块铺陈。">
<title>LMBrush · 自然语言矢量画面</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div>
        <h1>LMBrush</h1>
        <p>自然语言 → 绘制计划 → 矢量画面</p>
      </div>
    </div>
    <div class="status" id="status" data-state="idle" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="statusText">检测服务中</span>
    </div>
  </header>

  <main class="grid">
    <section class="panel brief" aria-label="需求输入">
      <div class="brief-row">
        <div class="field reference-field">
          <span class="label">参考图（可选）</span>
          <div class="reference" id="reference">
            <input type="file" id="referenceInput" accept="image/*" hidden>
            <button type="button" class="reference-drop" id="referenceDrop"
              title="用当前笔触方案解析并重绘；描述可以留空">
              <span class="reference-add" aria-hidden="true">＋</span>
              <span class="reference-copy">
                <b>上传一张参考图</b>
                <small>点击或拖入<br>描述可留空</small>
              </span>
            </button>
            <div class="reference-picked" id="referencePicked" hidden>
              <img id="referencePreview" alt="参考图预览">
              <div class="reference-meta">
                <b id="referenceName">reference</b>
                <small id="referenceSize"></small>
              </div>
              <button type="button" id="removeReference" class="mini">移除</button>
            </div>
          </div>
        </div>

        <div class="field prompt-field">
          <div class="label-row">
            <label class="label" for="prompt" id="promptLabel">描述你想要的画面</label>
            <div class="label-actions">
              <button type="button" id="restore" class="mini" hidden title="回到本次润色前的原始描述">恢复原文</button>
              <button type="button" id="enrich" class="mini" hidden title="让 LLM 把当前原文随机扩展成更丰富的画面提示">润色描述</button>
            </div>
          </div>
          <textarea id="prompt" rows="5" maxlength="2000"
            placeholder="例如：戴圆眼镜的短发女孩，暖色调，窗边斜光"></textarea>
        </div>
      </div>

      <div class="examples" id="examples" aria-label="示例需求"></div>

      <div class="field">
        <span class="label">画面风格</span>
        <div class="segmented" id="styleGroup" role="group" aria-label="画面风格">
          <button type="button" data-style="auto" class="on" aria-pressed="true">自动</button>
          <button type="button" data-style="flat" aria-pressed="false">扁平</button>
          <button type="button" data-style="line" aria-pressed="false">线稿</button>
          <button type="button" data-style="gradient" aria-pressed="false">渐变</button>
          <button type="button" data-style="minimal" aria-pressed="false">极简</button>
        </div>
      </div>

      <div class="field">
        <span class="label">笔触大小</span>
        <div class="segmented" id="brushGroup" role="group" aria-label="笔触大小">
          <button type="button" data-brush="0.3" aria-pressed="false">纤毫</button>
          <button type="button" data-brush="0.45" aria-pressed="false">极细</button>
          <button type="button" data-brush="0.8" aria-pressed="false">细腻</button>
          <button type="button" data-brush="1" class="on" aria-pressed="true">标准</button>
          <button type="button" data-brush="1.35" aria-pressed="false">粗犷</button>
        </div>
      </div>

      <div class="field">
        <span class="label">笔触风格</span>
        <div class="control-row">
          <div class="segmented" id="paintStyleGroup" role="group" aria-label="笔触风格">
            <button type="button" data-paint-style="classic" class="on" aria-pressed="true">经典笔触</button>
            <button type="button" data-paint-style="blockin" aria-pressed="false">色块铺陈</button>
          </div>
          <label class="switch" id="detailSwitch">
            <span class="switch-name">丰富细节</span>
            <input type="checkbox" id="detailToggle">
            <span class="switch-track" aria-hidden="true"></span>
            <span class="switch-text" id="detailText">关闭 · 只生成一次</span>
          </label>
        </div>
      </div>

      <div class="field">
        <span class="label">生成方式</span>
        <select id="mode" aria-label="生成方式">
          <option value="auto">自动（优先 LLM，失败回退本地）</option>
          <option value="llm">只用 LLM</option>
          <option value="local">只用本地规则</option>
        </select>
      </div>

      <div class="field">
        <span class="label">配色包（LLM）</span>
        <select id="pack" aria-label="配色包">
          <option value="none">不指定</option>
        </select>
      </div>

      <div class="generate-row">
        <button type="button" id="generate" class="primary">
          <span id="generateLabel">生成画面</span>
          <kbd>Ctrl / ⌘ + Enter</kbd>
        </button>
        <button type="button" id="variant" class="secondary" title="同一需求换一个构图，会绕过缓存">换一张</button>
      </div>

      <p class="hint" id="hint" role="status" aria-live="polite">
        画面由一笔一笔的油画笔触构成。切换笔触风格或大小后再次生成，会复用当前构图；想换构图就再生成一次。
      </p>
    </section>

    <section class="panel stage-panel" aria-label="画面预览">
      <div class="stage" id="stage">
        <div class="empty">
          <p>还没有画面，输入描述后生成。</p>
        </div>
      </div>
      <div class="stagebar">
        <span id="meta">尚未生成</span>
        <div class="actions" id="actions" hidden>
          <button type="button" id="download" disabled>下载 SVG</button>
          <button type="button" id="downloadPng" disabled>下载 PNG</button>
        </div>
      </div>
    </section>
  </main>

  <section class="panel plan-panel">
    <details>
      <summary>绘制计划 JSON <span id="planSize"></span></summary>
      <pre id="plan">尚未生成</pre>
    </details>
  </section>

  <section class="history-panel" aria-label="历史记录">
    <div class="history-head">
      <h2>最近生成</h2>
      <button type="button" id="clearHistory">清空</button>
    </div>
    <div class="history" id="history"></div>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
